<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="../../es/Programacion/progstyle.css">
    </head>
    <body>
    <div id="loading"></div>
        <div id="mainbod">
        <div id="bodaux">
        <div id="python">
            <h1>Python projects.</h1>
        </div>
        <div id="csharp"></div>
            <h1>C# projects.</h1>
        
        <div id="HTML">
            <h1>HTML and CSS projects.</h1>
            <h2>It's a me, a webpage! Press F12.</h2>
            <p>Seriously, I did this without presets.</p>
        </div>
        </div>
        </div>
    </body>
            <script>
            const maindiv = document.getElementById("mainbod")
            const auxdiv = document.getElementById("bodaux")
            maindiv.style.backgroundImage = sessionStorage.getItem("background");
            //if (!maindiv.style.backgroundImage) return;
            //document.body.style.backgroundSize   = 'cover';
            const coords = JSON.parse(sessionStorage.getItem("coords"));
            //if (!coords) return;
            if (coords) {
                maindiv.style.position = "absolute";
                maindiv.style.top = `${coords.top}px`;
                console.log("${coords.top}px")
                console.log(coords.y)
                console.log(coords.top)
                maindiv.style.bottom = `${coords.bottom}px`;
                maindiv.style.left = `${coords.left}px`;
                maindiv.style.right = `${coords.right}px`;
                maindiv.style.width = `${coords.width}px`;
                maindiv.style.height = `${coords.height}px`;
                maindiv.style.x = `(${coords.x}px)`;
                maindiv.style.y = `(${coords.y}px)`;
                auxdiv.style.position = "absolute"
                auxdiv.style.x = `${Math.abs(coords.x)}px`;
                auxdiv.style.y = `${Math.abs(coords.y)}px`;
                auxdiv.style.top = `${Math.abs(coords.top)}px`;
                console.log(Math.abs(coords.top*2))
            }
            function backgroundadjust(){
                maindiv.style.width = "100%"
                maindiv.style.right = "100%"    };
            window.addEventListener("resize", backgroundadjust);
            window.onload = function () {
                const tetera = document.getElementById("loading");
                if (tetera) {
                   setTimeout(() => {
                    tetera.classList.add('fade-out');
                   }, 3000);           // triggers CSS transition
                    setTimeout(() => { tetera.remove(); }, 3000); // remove after animation
                }
            };

        </script>
</html>
